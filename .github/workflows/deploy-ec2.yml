# Infra ativa (infra2/terraform) — EC2 único rodando docker-compose.vps.yml,
# ver docs/deploy/ec2-rollout.md. Sem ECR: não builda/empurra imagem pra
# lugar nenhum, só manda a própria instância se atualizar (git checkout do
# commit + `docker compose up -d --build`) via SSM Session Manager — a
# instância não tem porta 22 exposta, é assim que o pipeline chega nela
# (mesmo racional do acesso administrativo manual, ver infra2/terraform/
# modules/compute/main.tf).
name: Deploy (EC2 / infra2)

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  # terraform output -raw instance_id (infra2/terraform) — só muda se a
  # instância for recriada (ela tem lifecycle.ignore_changes em ami/
  # user_data justamente pra isso não acontecer em applies de rotina).
  INSTANCE_ID: i-0246eb93df7075288
  APP_DIR: /home/ec2-user/gespriority_claude

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN_EC2 }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM (git checkout + migrate + docker compose up)
        run: |
          cat > /tmp/ssm-params.json <<EOF
          {
            "commands": [
              "set -e",
              "cd $APP_DIR",
              "git fetch origin main",
              "git checkout $GITHUB_SHA",
              "docker compose -f docker-compose.vps.yml run --rm app php artisan migrate --force",
              "docker compose -f docker-compose.vps.yml up -d --build app queue"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $GITHUB_SHA" \
            --parameters file:///tmp/ssm-params.json \
            --query 'Command.CommandId' --output text)
          echo "SSM CommandId: $COMMAND_ID"

          # O waiter erroria sozinho se o comando terminar em Failed/Cancelled/
          # TimedOut — deixa passar aqui pra checar o Status explicitamente
          # embaixo (senão o step falha sem mostrar stdout/stderr do comando).
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text)

          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy falhou via SSM (status: $STATUS)"
            exit 1
          fi

      - name: Validar
        run: curl -fsS -o /dev/null "https://api.gespriority.com.br/up"
