; Mitigação oficial do PHP pro CVE-2026-109619 (PHP2Shell) e pro
; CVE-2026-115560 (este ainda sem correção lançada) — o progresso de upload
; de sessão nativo do PHP não é usado pela aplicação (API com tokens
; Sanctum, sem sessão PHP), então desligar não tem efeito colateral.
; Defesa extra: a correção de fato é o PHP >= 8.3.36 da imagem base.
session.upload_progress.enabled=0
