; O FrankenPHP/Octane mantém a aplicação em memória entre requisições, então
; o setup ECS não precisa disso. Sem Octane, cada request reprocessa os
; arquivos do zero — opcache é o que evita reler/reparsear o PHP a cada vez.
opcache.enable=1
opcache.validate_timestamps=0
opcache.max_accelerated_files=20000
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
